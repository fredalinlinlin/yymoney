<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淵 & 妍 記帳本</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2d5a4f;
            --primary-light: #4a8b7a;
            --secondary: #d4956c;
            --accent: #e8b89a;
            --bg-main: #faf8f5;
            --bg-card: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0ddd8;
            --shadow: rgba(45, 90, 79, 0.08);
            --yuan: #5b8e7d;
            --yen: #c97d5d;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 2rem 1.5rem;
            box-shadow: 0 4px 20px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .header-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .tab:hover {
            color: var(--primary);
        }

        .tab.active {
            color: var(--primary);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 2px 12px var(--shadow);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }

        input, select {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.2s ease;
            background: var(--bg-main);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .amount-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: right;
        }

        .divide-btn {
            padding: 0.875rem 1.25rem;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .divide-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .divide-btn:active {
            transform: translateY(0);
        }

        .tag-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .tag {
            padding: 0.625rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-main);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .tag:hover {
            border-color: var(--primary);
            background: white;
        }

        .tag.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-main) 100%);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid var(--border);
        }

        .summary-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .summary-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .currency-breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background: white;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .currency-label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .currency-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--text-primary);
        }

        .settlement-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .settlement-title {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        .settlement-message {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .settlement-amounts {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .settlement-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .month-selector {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .month-btn {
            padding: 0.625rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .month-btn:hover {
            border-color: var(--primary);
        }

        .month-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .year-month-select {
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-card);
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Noto Sans TC', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .year-month-select:hover {
            border-color: var(--primary);
        }

        .year-month-select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .month-confirm-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .month-confirm-btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .current-month-btn {
            padding: 0.75rem 1.5rem;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .current-month-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: var(--primary);
            color: white;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:hover {
            background: var(--bg-main);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            padding: 0.5rem 1rem;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .payer-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .payer-yuan {
            background: rgba(91, 142, 125, 0.2);
            color: var(--yuan);
        }

        .payer-yen {
            background: rgba(201, 125, 93, 0.2);
            color: var(--yen);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 1.5rem 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="header">
        <h1>💰 淵 & 妍 記帳本</h1>
        <div class="header-subtitle">
            共同理財，輕鬆分帳
            <span id="syncIndicator" style="margin-left: 1rem; font-size: 0.85rem;"></span>
        </div>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" data-tab="add-expense">記帳</button>
            <button class="tab" data-tab="summary">分帳總額</button>
            <button class="tab" data-tab="history">月份記錄</button>
            <button class="tab" data-tab="settings">⚙️ 設定</button>
        </div>

        <!-- 記帳頁面 -->
        <div class="tab-content active" id="add-expense">
            <div class="card">
                <form id="expenseForm">
                    <div class="form-group">
                        <label class="form-label">金額</label>
                        <div class="input-wrapper">
                            <input type="number" id="amount" step="0.01" min="0" class="amount-input" placeholder="0.00" required>
                            <button type="button" class="divide-btn" id="divideBtn">÷ 2</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">貨幣</label>
                        <select id="currency" required>
                            <option value="TWD">台幣 (TWD)</option>
                            <option value="JPY">日幣 (JPY)</option>
                            <option value="USD">美金 (USD)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">支付人</label>
                        <select id="payer" required>
                            <option value="淵">淵</option>
                            <option value="妍">妍</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">項目</label>
                        <input type="text" id="item" placeholder="例如：午餐、交通、購物..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">支付方式</label>
                        <div class="tag-group">
                            <div class="tag" data-tag="刷卡">💳 刷卡</div>
                            <div class="tag" data-tag="現金">💵 現金</div>
                            <div class="tag" data-tag="轉帳">🏦 轉帳</div>
                        </div>
                        <input type="hidden" id="paymentMethod" required>
                    </div>

                    <button type="submit" class="btn-primary">✓ 新增記帳</button>
                </form>
            </div>
        </div>

        <!-- 分帳總額頁面 -->
        <div class="tab-content" id="summary">
            <div class="summary-grid" id="summaryGrid">
                <!-- 動態生成 -->
            </div>
        </div>

        <!-- 月份記錄頁面 -->
        <div class="tab-content" id="history">
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; flex-wrap: wrap;">
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <select id="yearSelector" class="year-month-select">
                        <!-- 動態生成 -->
                    </select>
                    <select id="monthSelector" class="year-month-select">
                        <option value="01">1月</option>
                        <option value="02">2月</option>
                        <option value="03">3月</option>
                        <option value="04">4月</option>
                        <option value="05">5月</option>
                        <option value="06">6月</option>
                        <option value="07">7月</option>
                        <option value="08">8月</option>
                        <option value="09">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                    <button id="confirmMonthBtn" class="month-confirm-btn">確認</button>
                </div>
                <button id="currentMonthBtn" class="current-month-btn">📅 當月</button>
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>項目</th>
                                <th>金額</th>
                                <th>貨幣</th>
                                <th>支付人</th>
                                <th>方式</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <!-- 動態生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 設定頁面 -->
        <div class="tab-content" id="settings">
            <!-- Firebase 配置區 -->
            <div class="card">
                <h3 style="margin-bottom: 1.5rem; color: var(--primary);">🔧 Firebase 配置</h3>
                <div id="firebaseConfigForm">
                    <div class="form-group">
                        <label class="form-label">API Key</label>
                        <input type="text" id="apiKey" placeholder="AIza...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Auth Domain</label>
                        <input type="text" id="authDomain" placeholder="your-project.firebaseapp.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Database URL</label>
                        <input type="text" id="databaseURL" placeholder="https://your-project.firebaseio.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Project ID</label>
                        <input type="text" id="projectId" placeholder="your-project-id">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Storage Bucket</label>
                        <input type="text" id="storageBucket" placeholder="your-project.appspot.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Messaging Sender ID</label>
                        <input type="text" id="messagingSenderId" placeholder="123456789">
                    </div>
                    <div class="form-group">
                        <label class="form-label">App ID</label>
                        <input type="text" id="appId" placeholder="1:123456789:web:abc123">
                    </div>
                    <button type="button" id="saveConfigBtn" class="btn-primary">💾 儲存配置</button>
                    <button type="button" id="clearConfigBtn" class="btn-primary" style="background: var(--text-secondary); margin-left: 0.5rem;">🗑️ 清除配置</button>
                </div>
            </div>

            <!-- 登入狀態區 -->
            <div class="card">
                <h3 style="margin-bottom: 1.5rem; color: var(--primary);">🔐 登入狀態</h3>
                <div id="loginSection">
                    <div id="notLoggedIn">
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" id="loginEmail" placeholder="your-email@example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">密碼</label>
                            <input type="password" id="loginPassword" placeholder="至少6個字元">
                        </div>
                        <button type="button" id="loginBtn" class="btn-primary">🔑 登入</button>
                    </div>
                    <div id="loggedIn" style="display: none;">
                        <p style="margin-bottom: 1rem;">✅ 已登入：<strong id="currentUserEmail"></strong></p>
                        <button type="button" id="logoutBtn" class="btn-primary" style="background: var(--text-secondary);">🚪 登出</button>
                    </div>
                </div>
            </div>

            <!-- 資料同步區 -->
            <div class="card">
                <h3 style="margin-bottom: 1.5rem; color: var(--primary);">☁️ 資料同步</h3>
                <div style="margin-bottom: 1rem;">
                    <p>同步狀態：<strong id="syncStatusText">🔴 離線</strong></p>
                </div>
                <button type="button" id="uploadDataBtn" class="btn-primary" style="background: var(--secondary);">📤 上傳本地資料到雲端</button>
                <p style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--text-secondary);">首次設定時使用，將現有記帳資料同步到 Firebase</p>
            </div>

            <!-- 說明區 -->
            <div class="card" style="background: var(--accent); background: linear-gradient(135deg, rgba(232, 184, 154, 0.2) 0%, rgba(212, 149, 108, 0.2) 100%);">
                <h3 style="margin-bottom: 1rem; color: var(--primary);">📖 使用說明</h3>
                <ul style="margin-left: 1.5rem; line-height: 2;">
                    <li>Firebase 配置只儲存在本地瀏覽器，不會上傳到 GitHub</li>
                    <li>請參考 <code>README_FIREBASE.md</code> 完成 Firebase 專案設定</li>
                    <li>登入後會自動啟用即時同步功能</li>
                    <li>多裝置間資料會在 1-2 秒內同步</li>
                    <li>離線時仍可正常記帳，連線後自動同步</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 全域變數
        let expenses = [];
        let selectedPaymentMethod = '';
        let currentMonth = '';

        // Firebase 相關全域變數
        let firebaseApp = null;
        let firebaseInitialized = false;
        let currentUser = null;
        let firebaseConfig = null;
        let syncStatus = 'offline'; // 'offline', 'syncing', 'synced', 'error'
        let isSyncing = false; // 防止重複同步

        // ==================== Firebase 配置管理 ====================

        // 載入 Firebase 配置
        async function loadFirebaseConfig() {
            try {
                const result = await window.storage.get('firebase-config');
                if (result && result.value) {
                    firebaseConfig = JSON.parse(result.value);
                    console.log('Firebase 配置載入成功');
                    // 自動填入表單
                    if (document.getElementById('apiKey')) {
                        document.getElementById('apiKey').value = firebaseConfig.apiKey || '';
                        document.getElementById('authDomain').value = firebaseConfig.authDomain || '';
                        document.getElementById('databaseURL').value = firebaseConfig.databaseURL || '';
                        document.getElementById('projectId').value = firebaseConfig.projectId || '';
                        document.getElementById('storageBucket').value = firebaseConfig.storageBucket || '';
                        document.getElementById('messagingSenderId').value = firebaseConfig.messagingSenderId || '';
                        document.getElementById('appId').value = firebaseConfig.appId || '';
                    }
                    return true;
                }
            } catch (error) {
                console.log('尚未配置 Firebase');
            }
            return false;
        }

        // 儲存 Firebase 配置
        async function saveFirebaseConfig(config) {
            try {
                await window.storage.set('firebase-config', JSON.stringify(config));
                firebaseConfig = config;
                console.log('Firebase 配置儲存成功');
                return true;
            } catch (error) {
                console.error('Firebase 配置儲存失敗:', error);
                alert('配置儲存失敗，請稍後再試');
                return false;
            }
        }

        // 驗證 Firebase 配置
        function validateFirebaseConfig(config) {
            const required = ['apiKey', 'authDomain', 'databaseURL', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
            for (const field of required) {
                if (!config[field] || config[field].trim() === '') {
                    return false;
                }
            }
            return true;
        }

        // 清除 Firebase 配置
        async function clearFirebaseConfig() {
            try {
                await window.storage.set('firebase-config', '');
                firebaseConfig = null;
                firebaseInitialized = false;
                console.log('Firebase 配置已清除');
                // 清空表單
                document.getElementById('apiKey').value = '';
                document.getElementById('authDomain').value = '';
                document.getElementById('databaseURL').value = '';
                document.getElementById('projectId').value = '';
                document.getElementById('storageBucket').value = '';
                document.getElementById('messagingSenderId').value = '';
                document.getElementById('appId').value = '';
                alert('✓ Firebase 配置已清除');
            } catch (error) {
                console.error('清除配置失敗:', error);
            }
        }

        // ==================== Firebase 初始化與認證 ====================

        // 初始化 Firebase
        async function initFirebase() {
            if (!firebaseConfig) {
                console.log('Firebase 配置未載入，跳過初始化');
                return false;
            }

            if (firebaseInitialized) {
                console.log('Firebase 已初始化');
                return true;
            }

            try {
                firebaseApp = firebase.initializeApp(firebaseConfig);
                firebaseInitialized = true;
                console.log('✓ Firebase 初始化成功');

                // 監聽認證狀態變化
                firebase.auth().onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        console.log('使用者已登入:', user.email);
                        updateLoginUI(true);
                        // 啟動即時同步
                        await setupFirebaseSync();
                    } else {
                        currentUser = null;
                        console.log('使用者未登入');
                        updateLoginUI(false);
                        setSyncStatus('offline');
                    }
                });

                return true;
            } catch (error) {
                console.error('Firebase 初始化失敗:', error);
                alert('Firebase 初始化失敗：' + error.message);
                return false;
            }
        }

        // 登入
        async function login(email, password) {
            if (!firebaseInitialized) {
                alert('請先配置 Firebase');
                return false;
            }

            try {
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                currentUser = userCredential.user;
                console.log('✓ 登入成功:', currentUser.email);
                alert('✓ 登入成功！');
                return true;
            } catch (error) {
                console.error('登入失敗:', error);
                let errorMessage = '登入失敗：';
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage += 'Email 格式錯誤';
                        break;
                    case 'auth/user-disabled':
                        errorMessage += '使用者已被停用';
                        break;
                    case 'auth/user-not-found':
                        errorMessage += '使用者不存在';
                        break;
                    case 'auth/wrong-password':
                        errorMessage += '密碼錯誤';
                        break;
                    default:
                        errorMessage += error.message;
                }
                alert(errorMessage);
                return false;
            }
        }

        // 登出
        async function logout() {
            try {
                await firebase.auth().signOut();
                currentUser = null;
                console.log('✓ 登出成功');
                alert('✓ 已登出');
                setSyncStatus('offline');
            } catch (error) {
                console.error('登出失敗:', error);
                alert('登出失敗：' + error.message);
            }
        }

        // 更新登入 UI
        function updateLoginUI(isLoggedIn) {
            const notLoggedIn = document.getElementById('notLoggedIn');
            const loggedIn = document.getElementById('loggedIn');
            const currentUserEmail = document.getElementById('currentUserEmail');

            if (isLoggedIn && currentUser) {
                notLoggedIn.style.display = 'none';
                loggedIn.style.display = 'block';
                currentUserEmail.textContent = currentUser.email;
            } else {
                notLoggedIn.style.display = 'block';
                loggedIn.style.display = 'none';
            }
        }

        // ==================== Firebase 即時同步 ====================

        // 設定 Firebase 即時同步
        async function setupFirebaseSync() {
            if (!firebaseInitialized || !currentUser) {
                console.log('無法啟動同步：Firebase 未初始化或使用者未登入');
                return;
            }

            const dbRef = firebase.database().ref('expenses');

            // 監聽所有資料變更
            dbRef.on('value', async (snapshot) => {
                if (isSyncing) {
                    console.log('正在同步中，跳過此次更新');
                    return;
                }

                const cloudData = snapshot.val();
                if (cloudData && typeof cloudData === 'object') {
                    // 將物件轉換為陣列
                    const cloudExpenses = Object.values(cloudData).filter(item => item && item.id);

                    // 按 id 降序排序（最新的在前）
                    cloudExpenses.sort((a, b) => b.id - a.id);

                    // 更新內存資料
                    expenses = cloudExpenses;

                    // 同步到本地快取
                    try {
                        await window.storage.set('expenses-data', JSON.stringify(expenses));
                        console.log('✓ 雲端資料已同步到本地:', expenses.length, '筆');
                    } catch (error) {
                        console.error('本地快取更新失敗:', error);
                    }

                    // 更新 UI
                    updateAllViews();

                    setSyncStatus('synced');
                } else if (cloudData === null) {
                    console.log('雲端資料為空');
                }
            });

            // 監聽連線狀態
            firebase.database().ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    console.log('✓ Firebase 已連線');
                    if (syncStatus !== 'syncing') {
                        setSyncStatus('synced');
                    }
                } else {
                    console.log('✗ Firebase 已斷線');
                    setSyncStatus('offline');
                }
            });

            console.log('✓ Firebase 即時同步已啟動');
        }

        // 同步狀態管理
        function setSyncStatus(status) {
            syncStatus = status;
            updateSyncIndicator();
        }

        function updateSyncIndicator() {
            const indicator = document.getElementById('syncIndicator');
            const statusText = document.getElementById('syncStatusText');
            const statusMap = {
                'synced': '🟢 已同步',
                'syncing': '🟡 同步中',
                'offline': '🔴 離線',
                'error': '⚠️ 錯誤'
            };
            const statusDisplay = statusMap[syncStatus] || '';
            if (indicator) indicator.textContent = statusDisplay;
            if (statusText) statusText.textContent = statusDisplay;
        }

        // 上傳本地資料到雲端
        async function uploadLocalDataToCloud() {
            if (!firebaseInitialized || !currentUser) {
                alert('請先登入 Firebase');
                return;
            }

            try {
                setSyncStatus('syncing');
                isSyncing = true;

                // 將陣列轉換為物件格式
                const updates = {};
                expenses.forEach(expense => {
                    const key = `expense_${expense.id}`;
                    updates[`/expenses/${key}`] = expense;
                });

                await firebase.database().ref().update(updates);

                isSyncing = false;
                setSyncStatus('synced');
                alert(`✓ 成功上傳 ${expenses.length} 筆記錄到雲端！`);
                console.log('✓ 本地資料已上傳到雲端');
            } catch (error) {
                isSyncing = false;
                setSyncStatus('error');
                console.error('上傳資料失敗:', error);
                alert('上傳失敗：' + error.message);
            }
        }

        // 初始化
        async function init() {
            // 載入 Firebase 配置
            await loadFirebaseConfig();

            // 嘗試初始化 Firebase
            if (firebaseConfig) {
                await initFirebase();
            }

            // 載入本地資料（快速顯示）
            await loadExpenses();
            setupEventListeners();
            updateAllViews();
        }

        // 載入資料
        async function loadExpenses() {
            try {
                const result = await window.storage.get('expenses-data');
                if (result && result.value) {
                    expenses = JSON.parse(result.value);
                    console.log('載入資料成功:', expenses.length, '筆記錄');
                }
            } catch (error) {
                console.log('首次使用，初始化空資料');
                expenses = [];
            }
        }

        // 儲存資料
        async function saveExpenses() {
            // 1. 立即儲存到本地（確保不遺失）
            try {
                await window.storage.set('expenses-data', JSON.stringify(expenses));
                console.log('本地儲存成功:', expenses.length, '筆記錄');
            } catch (error) {
                console.error('本地儲存失敗:', error);
                alert('儲存失敗，請稍後再試');
                return null;
            }

            // 2. 同步到 Firebase（如果已登入）
            if (firebaseInitialized && currentUser) {
                try {
                    setSyncStatus('syncing');
                    isSyncing = true;

                    // 關鍵：逐筆寫入而非覆蓋整個資料庫
                    const updates = {};
                    expenses.forEach(expense => {
                        const key = `expense_${expense.id}`;
                        updates[`/expenses/${key}`] = expense;
                    });

                    await firebase.database().ref().update(updates);

                    isSyncing = false;
                    setSyncStatus('synced');
                    console.log('雲端同步成功');
                } catch (error) {
                    isSyncing = false;
                    console.error('雲端同步失敗:', error);
                    setSyncStatus('error');
                    // 不影響本地儲存的成功狀態
                }
            }

            return true;
        }

                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

                }
            });

            // ==================== 設定頁面事件監聽器 ====================

            // 儲存 Firebase 配置
            document.getElementById('saveConfigBtn').addEventListener('click', async () => {
                const config = {

                }

                const saved = await saveFirebaseConfig(config);
                if (saved) {
                    alert('✓ Firebase 配置已儲存');

                    await initFirebase();
                }
            });

            // 清除 Firebase 配置
            document.getElementById('clearConfigBtn').addEventListener('click', async () => {
                if (confirm('確定要清除 Firebase 配置嗎？這將會登出並停用雲端同步。')) {

                        await logout();
                    }

            document.getElementById('loginBtn').addEventListener('click', async () => {

            document.getElementById('logoutBtn').addEventListener('click', async () => {

                }
            });

            // 上傳本地資料到雲端
            document.getElementById('uploadDataBtn').addEventListener('click', async () => {
                if (confirm(`確定要上傳 ${expenses.length} 筆本地記錄到雲端嗎？`)) {
                    await uploadLocalDataToCloud();
                }
            });
        }

        // 計算台幣總額
        function calculateTotalInTWD() {
            const summary = calculateSummary();
            const jpyRate = parseFloat(document.getElementById('jpyRateTotal').value) || 0.23;
            const usdRate = parseFloat(document.getElementById('usdRateTotal').value) || 31;

            // 將所有幣種換算成台幣
            const twdFromTWD = summary.settlement.TWD;
            const twdFromJPY = summary.settlement.JPY * jpyRate;
            const twdFromUSD = summary.settlement.USD * usdRate;

            const totalTWD = twdFromTWD + twdFromJPY + twdFromUSD;

            const resultDiv = document.getElementById('totalResult');

            if (Math.abs(totalTWD) < 1) {
                resultDiv.innerHTML = `
                    <div style="font-size: 2rem; font-weight: 700; color: white;">✓ 已結清</div>
                `;
            } else {
                const owedPerson = totalTWD > 0 ? '妍 需還 淵' : '淵 需還 妍';
                resultDiv.innerHTML = `
                    <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem;">${owedPerson}</div>
                    <div style="font-family: 'JetBrains Mono', monospace; font-size: 2.5rem; font-weight: 700; color: white;">
                        NT$ ${Math.abs(totalTWD).toLocaleString()}
                    </div>
                    <div style="font-size: 0.85rem; opacity: 0.8; margin-top: 0.5rem;">
                        (台幣 ${twdFromTWD.toLocaleString()} + 日幣換算 ${twdFromJPY.toLocaleString()} + 美金換算 ${twdFromUSD.toLocaleString()})
                    </div>
                `;
            }
        }

        // 計算分帳
        function calculateSummary() {
            const summary = {
                yuan: { TWD: 0, JPY: 0, USD: 0 },
                yen: { TWD: 0, JPY: 0, USD: 0 },
                settlement: { TWD: 0, JPY: 0, USD: 0, message: '' }
            };

            expenses.forEach(expense => {
                if (expense.payer === '淵') {
                    summary.yuan[expense.currency] += expense.amount;
                } else {
                    summary.yen[expense.currency] += expense.amount;
                }
            });

            // 計算結算金額（直接計算差額）
            // 正數表示妍需要還淵，負數表示淵需要還妍
            summary.settlement.TWD = summary.yuan.TWD - summary.yen.TWD;
            summary.settlement.JPY = summary.yuan.JPY - summary.yen.JPY;
            summary.settlement.USD = summary.yuan.USD - summary.yen.USD;

            // 判斷誰欠誰（以台幣為主要判斷）
            const totalOwed = summary.settlement.TWD + summary.settlement.JPY * 0.23 + summary.settlement.USD * 31;

            if (Math.abs(totalOwed) < 1) {
                summary.settlement.message = '已結清 ✓';
            } else if (totalOwed > 0) {
                summary.settlement.message = '妍 需還 淵';
            } else {
                summary.settlement.message = '淵 需還 妍';
            }

            return summary;
        }

        // 渲染歷史記錄
        function renderHistory() {
            console.log('渲染歷史記錄，記錄數:', expenses.length);

            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonthNum = now.getMonth() + 1;
            const currentYearMonth = `${currentYear}-${String(currentMonthNum).padStart(2, '0')}`;

            // 如果沒有設定當前月份，預設為當月
            if (!currentMonth) {
                currentMonth = currentYearMonth;
            }

            // 生成年份選擇器（2025-2030）
            const yearSelector = document.getElementById('yearSelector');
            let yearOptions = '';
            for (let year = 2025; year <= 2030; year++) {
                yearOptions += `<option value="${year}">${year}年</option>`;
            }
            yearSelector.innerHTML = yearOptions;

            // 設定當前選擇的年月
            const [selectedYear, selectedMonth] = currentMonth.split('-');
            yearSelector.value = selectedYear;
            document.getElementById('monthSelector').value = selectedMonth;

            // 確認按鈕事件
            document.getElementById('confirmMonthBtn').onclick = () => {
                const year = document.getElementById('yearSelector').value;
                const month = document.getElementById('monthSelector').value;
                currentMonth = `${year}-${month}`;
                renderHistory();
            };

            // 當月按鈕事件
            document.getElementById('currentMonthBtn').onclick = () => {
                currentMonth = currentYearMonth;
                renderHistory();
            };

            console.log('當前選擇月份:', currentMonth);

            // 過濾當前月份的記錄
            const filteredExpenses = expenses.filter(e => {
                const date = new Date(e.date);
                const expenseMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                return expenseMonth === currentMonth;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            // 渲染表格
            const tbody = document.getElementById('historyBody');
            if (filteredExpenses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <div class="empty-state-text">本月尚無記帳記錄</div>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filteredExpenses.map(expense => {
                    const date = new Date(expense.date);
                    const formattedDate = `${date.getMonth() + 1}/${date.getDate()}`;
                    const currencySymbol = expense.currency === 'TWD' ? 'NT$' : expense.currency === 'JPY' ? '¥' : '$';

                    return `
                        <tr>
                            <td>${formattedDate}</td>
                            <td>${expense.item}</td>
                            <td style="font-family: 'JetBrains Mono', monospace; font-weight: 600;">${currencySymbol} ${expense.amount.toLocaleString()}</td>
                            <td>${expense.currency}</td>
                            <td><span class="payer-badge payer-${expense.payer === '淵' ? 'yuan' : 'yen'}">${expense.payer}</span></td>
                            <td>${expense.paymentMethod}</td>
                            <td><button class="delete-btn" onclick="deleteExpense(${expense.id})">刪除</button></td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // 刪除記帳
        async function deleteExpense(id) {
            if (confirm('確定要刪除這筆記帳嗎？')) {
                // 從內存中刪除
                expenses = expenses.filter(e => e.id !== id);

                // 儲存到本地
                try {
                    await window.storage.set('expenses-data', JSON.stringify(expenses));
                } catch (error) {
                    console.error('本地刪除失敗:', error);
                }

                // 從 Firebase 刪除
                if (firebaseInitialized && currentUser) {
                    try {
                        const key = `expense_${id}`;
                        await firebase.database().ref(`expenses/${key}`).remove();
                        console.log('✓ 已從雲端刪除');
                    } catch (error) {
                        console.error('雲端刪除失敗:', error);
                    }
                }

                updateAllViews();
            }
        }

        // 初始化應用
        init();
    </script>
</body>
</html>
