<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payback Writer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #8AB4F8;
            --primary-gradient: linear-gradient(135deg, #2E3AE8 0%, #9B5DE5 100%);
            --secondary: #d4956c;
            --accent: #e8b89a;
            --bg-main: #000000;
            --bg-card: rgba(25, 25, 25, 0.6);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --yuan: #81c784;
            --yen: #ffb74d;
            --nav-height: 60px;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 0;
            padding-bottom: calc(var(--nav-height) + 2rem);
            /* Space for bottom nav */
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-status {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Bottom Navigation */
        .tabs {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 1000;
            margin-bottom: 0;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab {
            flex: 1;
            padding: 0.5rem;
            background: none;
            border: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .tab:hover {
            color: var(--primary);
        }

        .tab.active {
            color: #ffffff;
            font-weight: 700;
        }

        .tab.active::after {
            display: none;
            /* Remove old underline */
        }

        .tab.active::before {
            content: '';
            position: absolute;
            top: 0;
            width: 40%;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 0 0 4px 4px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 0.5rem;
            align-items: stretch;
        }

        input,
        select {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.3);
            color: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #8AB4F8;
            background: rgba(0, 0, 0, 0.5);
        }

        .amount-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            text-align: right;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border);
            border-radius: 0;
            padding: 0.5rem 0;
        }

        .amount-input:focus {
            background: transparent;
            border-bottom-color: #8AB4F8;
        }

        .divide-btn {
            padding: 0 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .divide-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .tag-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.75rem;
        }

        .tag {
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .tag:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .tag.selected {
            background: var(--primary-gradient);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(46, 58, 232, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
            box-shadow: 0 4px 15px rgba(46, 58, 232, 0.3);
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 58, 232, 0.5);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--bg-card-border);
        }

        .summary-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .summary-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
        }

        .currency-breakdown {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .currency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .currency-label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .currency-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: white;
        }

        .settlement-card {
            background: var(--primary-gradient);
            color: white;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(46, 58, 232, 0.3);
        }

        .settlement-title {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settlement-message {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .settlement-amounts {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .settlement-item {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .month-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .year-month-select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Noto Sans TC', sans-serif;
            color: white;
            cursor: pointer;
        }

        button {
            border-radius: 50px !important;
        }

        .month-confirm-btn,
        .current-month-btn {
            border-radius: 50px;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }

        thead {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            color: white;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            padding: 0.4rem 0.8rem;
            background: rgba(231, 76, 60, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 50px;
            font-size: 0.8rem;
        }

        .delete-btn:hover {
            background: rgba(231, 76, 60, 0.4);
        }

        .payer-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .payer-yuan {
            background: rgba(129, 199, 132, 0.2);
            color: #81c784;
            border: 1px solid rgba(129, 199, 132, 0.3);
        }

        .payer-yen {
            background: rgba(255, 183, 77, 0.2);
            color: #ffb74d;
            border: 1px solid rgba(255, 183, 77, 0.3);
        }

        .btn-purple-outline {
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: #9B5DE5;
            border: 1px solid #9B5DE5;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
            margin-top: 1rem;
        }

        .btn-purple-outline:hover {
            background: rgba(155, 93, 229, 0.1);
        }

        .small-btn {
            padding: 0.5rem 1.5rem !important;
            margin-top: 0 !important;
            font-size: 0.9rem !important;
            width: auto !important;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
            filter: saturate(0);
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>

<body>
    <div class="header">
        <h1>Payback Writer</h1>
        <div class="header-status">
            <span id="syncIndicator"></span>
        </div>
    </div>

    <div class="container">

        <!-- Bottom Navigation -->
        <div class="tabs">
            <button class="tab active" data-tab="add-expense">記帳</button>
            <button class="tab" data-tab="summary">分帳</button>
            <button class="tab" data-tab="history">月支出</button>
            <button class="tab" data-tab="settings">設定</button>
        </div>

        <!-- 記帳頁面 -->
        <div class="tab-content active" id="add-expense">
            <div class="card">
                <form id="expenseForm">
                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label class="form-label">金額</label>
                        <div class="input-wrapper">
                            <input type="number" id="amount" step="0.01" min="0" class="amount-input" placeholder="0"
                                required>
                            <button type="button" class="divide-btn" id="divideBtn">÷ 2</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">貨幣</label>
                        <select id="currency" required>
                            <option value="TWD" selected>台幣 (TWD)</option>
                            <option value="JPY">日幣 (JPY)</option>
                            <option value="USD">美金 (USD)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">支付人</label>
                        <select id="payer" required>
                            <option value="淵">淵</option>
                            <option value="妍">妍</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">項目</label>
                        <input type="text" id="item" placeholder="早餐、午餐、交通..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">支付方式</label>
                        <div class="tag-group">
                            <div class="tag" data-tag="刷卡">刷卡</div>
                            <div class="tag" data-tag="現金">現金</div>
                            <div class="tag" data-tag="轉帳">轉帳</div>
                        </div>
                        <input type="hidden" id="paymentMethod" required>
                    </div>

                    <button type="submit" class="btn-primary">✓ 新增記帳</button>
                </form>
            </div>
        </div>

        <!-- 分帳總額頁面 -->
        <div class="tab-content" id="summary">
            <div class="summary-grid" id="summaryGrid">
                <!-- 動態生成 -->
            </div>
        </div>

        <!-- 月份記錄頁面 -->
        <div class="tab-content" id="history">
            <div class="card">
                <div class="month-selector">
                    <select id="yearSelector" class="year-month-select">
                        <!-- 動態生成 -->
                    </select>
                    <select id="monthSelector" class="year-month-select">
                        <option value="01">1月</option>
                        <option value="02">2月</option>
                        <option value="03">3月</option>
                        <option value="04">4月</option>
                        <option value="05">5月</option>
                        <option value="06">6月</option>
                        <option value="07">7月</option>
                        <option value="08">8月</option>
                        <option value="09">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                    <button id="confirmMonthBtn" class="btn-purple-outline small-btn">確認</button>
                    <button id="currentMonthBtn" class="btn-purple-outline small-btn">當月</button>
                </div>

                <div class="table-wrapper">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>項目</th>
                                <th>金額</th>
                                <th>幣別</th>
                                <th>付款</th>
                                <th>方式</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <!-- 動態生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 設定頁面 -->
        <div class="tab-content" id="settings">

            <div class="card">
                <h3 style="margin-bottom: 1.5rem; color: #8AB4F8;">帳號</h3>
                <div id="loginSection">
                    <div id="notLoggedIn">
                        <p style="margin-bottom: 1rem; color: var(--text-secondary);">登入以同步資料</p>
                        <button type="button" id="loginBtn" class="btn-purple-outline">
                            Google 登入
                        </button>
                    </div>
                    <div id="loggedIn" style="display: none;">
                        <p style="margin-bottom: 1rem; color: white;">已登入:<strong id="currentUserEmail"
                                style="color: #8AB4F8;"></strong></p>
                        <button type="button" id="logoutBtn" class="btn-purple-outline">
                            登出
                        </button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-bottom: 1.5rem; color: #8AB4F8;">同步</h3>
                <div style="margin-bottom: 1rem;">
                    <p style="color: var(--text-secondary);">狀態:<strong id="syncStatusText" style="color: white;">🔴
                            離線</strong></p>
                </div>
                <button type="button" id="uploadDataBtn" class="btn-purple-outline">
                    上傳本地資料
                </button>
                <p style="margin-top: 0.8rem; font-size: 0.8rem; color: var(--text-secondary);">
                    將裝置資料覆蓋至雲端
                </p>
            </div>


        </div>
    </div>

    <script>
        // 全域變數
        let expenses = [];
        let selectedPaymentMethod = '';
        let currentMonth = '';

        // Firebase 相關全域變數
        let firebaseApp = null;
        let firebaseInitialized = false;
        let currentUser = null;

        // Firebase 配置 (已硬編碼)
        const firebaseConfig = {
            apiKey: "AIzaSyCmdbQnS5lfo2GJtm2tfewVbz_lHydztSw",
            authDomain: "yymoney-8c04e.firebaseapp.com",
            databaseURL: "https://yymoney-8c04e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "yymoney-8c04e",
            storageBucket: "yymoney-8c04e.firebasestorage.app",
            messagingSenderId: "639004027453",
            appId: "1:639004027453:web:1c17df51f3ba982d881854",
            measurementId: "G-VN303610EN"
        };
        let syncStatus = 'offline'; // 'offline', 'syncing', 'synced', 'error'
        let isSyncing = false; // 防止重複同步

        // 瀏覽器兼容性:如果 window.storage 不存在(非 Electron 環境),使用 localStorage
        if (!window.storage) {
            window.storage = {
                get: async (key) => {
                    const value = localStorage.getItem(key);
                    return { value: value };
                },
                set: async (key, value) => {
                    localStorage.setItem(key, value);
                }
            };
        }

        // ==================== Firebase 初始化與認證 ====================

        // 初始化 Firebase
        async function initFirebase() {
            if (firebaseInitialized) {
                console.log('Firebase 已初始化');
                return true;
            }

            try {
                firebaseApp = firebase.initializeApp(firebaseConfig);
                firebaseInitialized = true;
                console.log('✓ Firebase 初始化成功');

                // 監聽認證狀態變化
                firebase.auth().onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        console.log('使用者已登入:', user.email);
                        updateLoginUI(true);
                        // 啟動即時同步
                        await setupFirebaseSync();
                    } else {
                        currentUser = null;
                        console.log('使用者未登入');
                        updateLoginUI(false);
                        setSyncStatus('offline');
                    }
                });

                return true;
            } catch (error) {
                console.error('Firebase 初始化失敗:', error);
                alert('Firebase 初始化失敗:' + error.message);
                return false;
            }
        }

        // Google 登入
        async function loginWithGoogle() {
            if (!firebaseInitialized) {
                await initFirebase();
            }

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await firebase.auth().signInWithPopup(provider);
                currentUser = result.user;
                console.log('✓ Google 登入成功:', currentUser.email);
                return true;
            } catch (error) {
                console.error('登入失敗:', error);
                alert('登入失敗:' + error.message);
                return false;
            }
        }

        // 登出
        async function logout() {
            try {
                await firebase.auth().signOut();
                currentUser = null;
                console.log('✓ 登出成功');
                setSyncStatus('offline');
            } catch (error) {
                console.error('登出失敗:', error);
                alert('登出失敗:' + error.message);
            }
        }

        // 更新登入 UI
        function updateLoginUI(isLoggedIn) {
            const notLoggedIn = document.getElementById('notLoggedIn');
            const loggedIn = document.getElementById('loggedIn');
            const currentUserEmail = document.getElementById('currentUserEmail');

            if (isLoggedIn && currentUser) {
                notLoggedIn.style.display = 'none';
                loggedIn.style.display = 'block';
                currentUserEmail.textContent = currentUser.email;
            } else {
                notLoggedIn.style.display = 'block';
                loggedIn.style.display = 'none';
            }
        }

        // ==================== Firebase 即時同步 ====================

        // 設定 Firebase 即時同步
        async function setupFirebaseSync() {
            if (!firebaseInitialized || !currentUser) {
                console.log('無法啟動同步:Firebase 未初始化或使用者未登入');
                return;
            }

            const dbRef = firebase.database().ref('expenses');

            // 監聽所有資料變更
            dbRef.on('value', async (snapshot) => {
                if (isSyncing) {
                    console.log('正在同步中,跳過此次更新');
                    return;
                }

                const cloudData = snapshot.val();
                if (cloudData && typeof cloudData === 'object') {
                    // 將物件轉換為陣列
                    const cloudExpenses = Object.values(cloudData).filter(item => item && item.id);

                    // 按 id 降序排序(最新的在前)
                    cloudExpenses.sort((a, b) => b.id - a.id);

                    // 更新內存資料
                    expenses = cloudExpenses;

                    // 同步到本地快取
                    try {
                        await window.storage.set('expenses-data', JSON.stringify(expenses));
                        console.log('✓ 雲端資料已同步到本地:', expenses.length, '筆');
                    } catch (error) {
                        console.error('本地快取更新失敗:', error);
                    }

                    // 更新 UI
                    updateAllViews();

                    setSyncStatus('synced');
                } else if (cloudData === null) {
                    console.log('雲端資料為空');
                }
            });

            // 監聽連線狀態
            firebase.database().ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    console.log('✓ Firebase 已連線');
                    if (syncStatus !== 'syncing') {
                        setSyncStatus('synced');
                    }
                } else {
                    console.log('✗ Firebase 已斷線');
                    setSyncStatus('offline');
                }
            });

            console.log('✓ Firebase 即時同步已啟動');
        }

        // 同步狀態管理
        function setSyncStatus(status) {
            syncStatus = status;
            updateSyncIndicator();
        }

        function updateSyncIndicator() {
            const indicator = document.getElementById('syncIndicator');
            const statusText = document.getElementById('syncStatusText');
            const statusMap = {
                'synced': '🟢 已同步',
                'syncing': '🟡 同步中',
                'offline': '🔴 離線',
                'error': '⚠️ 錯誤'
            };
            const statusDisplay = statusMap[syncStatus] || '';
            if (indicator) indicator.textContent = statusDisplay;
            if (statusText) {
                statusText.textContent = statusDisplay;
                statusText.className = syncStatus;
            }
        }

        // 上傳本地資料到雲端
        async function uploadLocalDataToCloud() {
            if (!firebaseInitialized || !currentUser) {
                alert('請先登入 Firebase');
                return;
            }

            try {
                setSyncStatus('syncing');
                isSyncing = true;

                // 將陣列轉換為物件格式
                const updates = {};
                expenses.forEach(expense => {
                    const key = `expense_${expense.id}`;
                    updates[`/expenses/${key}`] = expense;
                });

                await firebase.database().ref().update(updates);

                isSyncing = false;
                setSyncStatus('synced');
                alert(`✓ 成功上傳 ${expenses.length} 筆記錄到雲端!`);
                console.log('✓ 本地資料已上傳到雲端');
            } catch (error) {
                isSyncing = false;
                setSyncStatus('error');
                console.error('上傳資料失敗:', error);
                alert('上傳失敗:' + error.message);
            }
        }

        // 初始化
        async function init() {
            // 立即初始化 Firebase (使用硬編碼配置)
            await initFirebase();

            // 載入本地資料(做為備用或離線顯示)
            await loadExpenses();
            setupEventListeners();
            updateAllViews();
        }

        // 載入資料
        async function loadExpenses() {
            try {
                const result = await window.storage.get('expenses-data');
                if (result && result.value) {
                    expenses = JSON.parse(result.value);
                    console.log('載入資料成功:', expenses.length, '筆記錄');
                }
            } catch (error) {
                console.log('首次使用,初始化空資料');
                expenses = [];
            }
        }

        // 儲存資料
        async function saveExpenses() {
            // 1. 立即儲存到本地(確保不遺失)
            try {
                await window.storage.set('expenses-data', JSON.stringify(expenses));
                console.log('本地儲存成功:', expenses.length, '筆記錄');
            } catch (error) {
                console.error('本地儲存失敗:', error);
                alert('儲存失敗,請稍後再試');
                return null;
            }

            // 2. 同步到 Firebase(如果已登入)
            if (firebaseInitialized && currentUser) {
                try {
                    setSyncStatus('syncing');
                    isSyncing = true;

                    // 關鍵:逐筆寫入而非覆蓋整個資料庫
                    const updates = {};
                    expenses.forEach(expense => {
                        const key = `expense_${expense.id}`;
                        updates[`/expenses/${key}`] = expense;
                    });

                    await firebase.database().ref().update(updates);

                    isSyncing = false;
                    setSyncStatus('synced');
                    console.log('雲端同步成功');
                } catch (error) {
                    isSyncing = false;
                    console.error('雲端同步失敗:', error);
                    setSyncStatus('error');
                    // 不影響本地儲存的成功狀態
                }
            }

            return true;
        }

        // 設定事件監聽
        function setupEventListeners() {
            // 分頁切換
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const targetTab = tab.dataset.tab;

                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                    tab.classList.add('active');
                    document.getElementById(targetTab).classList.add('active');

                    if (targetTab === 'summary') {
                        renderSummary();
                    } else if (targetTab === 'history') {
                        renderHistory();
                    }
                });
            });

            // 除以2按鈕
            document.getElementById('divideBtn').addEventListener('click', () => {
                const amountInput = document.getElementById('amount');
                const currentValue = parseFloat(amountInput.value) || 0;
                amountInput.value = (currentValue / 2).toFixed(2); // 保留兩位小數
            });

            // 支付方式選擇
            document.querySelectorAll('.tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
                    tag.classList.add('selected');
                    selectedPaymentMethod = tag.dataset.tag;
                    document.getElementById('paymentMethod').value = selectedPaymentMethod;
                });
            });

            // 表單提交
            document.getElementById('expenseForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!selectedPaymentMethod) {
                    alert('請選擇支付方式');
                    return;
                }

                const expense = {
                    id: Date.now(),
                    date: new Date().toISOString(),
                    amount: parseFloat(document.getElementById('amount').value),
                    currency: document.getElementById('currency').value,
                    payer: document.getElementById('payer').value,
                    item: document.getElementById('item').value,
                    paymentMethod: selectedPaymentMethod
                };

                console.log('新增記帳:', expense);
                expenses.push(expense);

                try {
                    const saveResult = await saveExpenses();

                    // 重置表單
                    document.getElementById('expenseForm').reset();
                    document.querySelectorAll('.tag').forEach(t => t.classList.remove('selected'));
                    selectedPaymentMethod = '';

                    // 為了方便連續記帳,不該alert阻擋
                    // alert('✓ 記帳成功!'); 

                    // 立即更新所有視圖
                    updateAllViews();
                } catch (error) {
                    console.error('新增失敗:', error);
                    // 如果儲存失敗,移除剛才新增的項目
                    expenses.pop();
                    alert('✗ 新增失敗,請稍後再試');
                }
            });

            // 登入
            document.getElementById('loginBtn').addEventListener('click', async () => {
                await loginWithGoogle();
            });

            // 登出
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                if (confirm('確定要登出嗎?')) {
                    await logout();
                }
            });

            // 上傳本地資料到雲端
            document.getElementById('uploadDataBtn').addEventListener('click', async () => {
                if (confirm(`確定要上傳 ${expenses.length} 筆本地記錄到雲端嗎?`)) {
                    await uploadLocalDataToCloud();
                }
            });
        }

        // 更新所有視圖
        function updateAllViews() {
            console.log('更新視圖,目前記錄數:', expenses.length);
            renderSummary();
            renderHistory();
        }

        // 渲染分帳總額
        function renderSummary() {

            grid.innerHTML = `

                            <span class="currency-value">${summary.yuan.USD.toLocaleString()}</span>

                <!-- 妍付 -->

                        </div>
                        <div class="currency-item">
                            <span class="currency-label">JPY</span>
                            <span class="currency-value">${summary.yen.JPY.toLocaleString()}</span>
                        </div>
                        <div class="currency-item">
                            <span class="currency-label">USD</span>
                            <span class="currency-value">${summary.yen.USD.toLocaleString()}</span>
                        </div>
                    </div>
                </div>

                <!-- 結算 -->
                <div class="settlement-card" style="grid-column: 1 / -1;">
                    <div class="settlement-title">結算建議</div>
                    
                     <!-- 顯示詳細欠款明細 -->
                     <div class="settlement-amounts">
                        <div class="settlement-item">
                            <span style="font-size: 0.9rem; color: var(--text-secondary); margin-right: 0.5rem;">台幣差額:</span>
                            <span style="color: ${summary.settlement.TWD >= 0 ? 'var(--yuan)' : 'var(--yen)'}">
                                ${summary.settlement.TWD > 0 ? '妍欠淵' : summary.settlement.TWD < 0 ? '淵欠妍' : ''} 
                                ${Math.abs(Math.round(summary.settlement.TWD)).toLocaleString()}
                            </span>
                        </div>
                        <div class="settlement-item">
                            <span style="font-size: 0.9rem; color: var(--text-secondary); margin-right: 0.5rem;">日幣差額:</span>
                            <span style="color: ${summary.settlement.JPY >= 0 ? 'var(--yuan)' : 'var(--yen)'}">
                                ${summary.settlement.JPY > 0 ? '妍欠淵' : summary.settlement.JPY < 0 ? '淵欠妍' : ''} 
                                ${Math.abs(Math.round(summary.settlement.JPY)).toLocaleString()}
                            </span>
                        </div>
                         <div class="settlement-item">
                            <span style="font-size: 0.9rem; color: var(--text-secondary); margin-right: 0.5rem;">美金差額:</span>
                            <span style="color: ${summary.settlement.USD >= 0 ? 'var(--yuan)' : 'var(--yen)'}">
                                ${summary.settlement.USD > 0 ? '妍欠淵' : summary.settlement.USD < 0 ? '淵欠妍' : ''} 
                                ${Math.abs(summary.settlement.USD).toFixed(2)}
                            </span>
                        </div>
                     </div>
                    
                    <div style="margin-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 1rem;">
                        <div style="display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap;">
                            <div style="display: flex; flex-direction: column; align-items: start;">
                                <label style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.2rem;">日幣匯率</label>
                                <input type="number" id="jpyRateTotal" value="0.23" step="0.001" style="width: 80px; padding: 0.5rem; font-size: 0.9rem;">
                            </div>
                             <div style="display: flex; flex-direction: column; align-items: start;">
                                <label style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.2rem;">美金匯率</label>
                                <input type="number" id="usdRateTotal" value="32" step="0.1" style="width: 80px; padding: 0.5rem; font-size: 0.9rem;">
                            </div>
                        </div>
                    
                        <button onclick="calculateTotalInTWD()" class="btn-purple-outline small-btn">
                            計算台幣總額
                        </button>
                        <div id="totalResult" style="margin-top: 1.5rem;"></div>
                    </div>
                </div>
            `;
        }

        // 計算台幣總額 (使用手動輸入匯率)
        function calculateTotalInTWD() {
            const summary = calculateSummary();

            const jpyRateInput = document.getElementById('jpyRateTotal');
            const usdRateInput = document.getElementById('usdRateTotal');

            const jpyRate = jpyRateInput ? parseFloat(jpyRateInput.value) || 0.23 : 0.23;
            const usdRate = usdRateInput ? parseFloat(usdRateInput.value) || 32 : 32;

            const twdTotal = summary.settlement.TWD + (summary.settlement.JPY * jpyRate) + (summary.settlement.USD * usdRate);

            const resultDiv = document.getElementById('totalResult');

            if (Math.abs(twdTotal) < 1) {
                resultDiv.innerHTML = '<div style="font-size: 1.5rem; font-weight: 700; color: #81c784;">已結清 ✓</div>';
            } else {
                const person = twdTotal > 0 ? '妍 需還 淵' : '淵 需還 妍';
                const color = twdTotal > 0 ? 'var(--yuan)' : 'var(--yen)';
                resultDiv.innerHTML = `
                    <div style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 0.5rem; color: var(--text-secondary);">總結算 (台幣)</div>
                    <div style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.2rem;">${person}</div>
                    <div style="font-size: 2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: ${color};">
                        NT$ ${Math.abs(Math.round(twdTotal)).toLocaleString()}
                    </div>
                    <div style="font-size: 0.75rem; opacity: 0.6; margin-top: 0.5rem;">
                        (匯率: 日幣 ${jpyRate}, 美金 ${usdRate})
                    </div>
                 `;
            }
        }


        // 計算分帳
        function calculateSummary() {
            const summary = {
                yuan: { TWD: 0, JPY: 0, USD: 0 },
                yen: { TWD: 0, JPY: 0, USD: 0 },
                settlement: { TWD: 0, JPY: 0, USD: 0, message: '' }
            };

            expenses.forEach(expense => {
                if (expense.payer === '淵') {
                    summary.yuan[expense.currency] += expense.amount;
                } else {
                    summary.yen[expense.currency] += expense.amount;
                }
            });

            // 計算結算金額(直接計算差額)
            // 正數表示妍需要還淵,負數表示淵需要還妍
            // 這裡簡單計算: (淵付 - 妍付) / 2 = 需還金額 ?? 
            // 不對,分帳邏輯是:
            // 總支出 = 淵付 + 妍付
            // 每人應付 = 總支出 / 2
            // 淵應付 = 總支出 / 2, 淵實付 = 淵付 => 淵多付 = 淵付 - (淵付+妍付)/2 = (淵付 - 妍付) / 2
            // 所以 差額 = (淵付 - 妍付) / 2

            summary.settlement.TWD = summary.yuan.TWD - summary.yen.TWD;
            summary.settlement.JPY = summary.yuan.JPY - summary.yen.JPY;
            summary.settlement.USD = summary.yuan.USD - summary.yen.USD;

            // 判斷誰欠誰(以台幣為主要判斷)
            // 這裡只是粗略判斷 message,實際金額看上面
            const totalOwed = summary.settlement.TWD + summary.settlement.JPY * 0.23 + summary.settlement.USD * 31;

            if (Math.abs(totalOwed) < 1) {
                summary.settlement.message = '已結清 ✓';
            } else if (totalOwed > 0) {
                // 淵多付,所以妍要還淵
                summary.settlement.message = '妍 需還 淵';
            } else {
                summary.settlement.message = '淵 需還 妍';
            }

            return summary;
        }

        // 渲染歷史記錄
        function renderHistory() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonthNum = now.getMonth() + 1;
            const currentYearMonth = `${currentYear}-${String(currentMonthNum).padStart(2, '0')}`;

            // 如果沒有設定當前月份,預設為當月
            if (!currentMonth) {
                currentMonth = currentYearMonth;
            }

            // 生成年份選擇器(2025-2030)
            const yearSelector = document.getElementById('yearSelector');
            let yearOptions = '';
            for (let year = 2025; year <= 2030; year++) {
                yearOptions += `<option value="${year}">${year}年</option>`;
            }
            yearSelector.innerHTML = yearOptions;

            // 設定當前選擇的年月
            const [selectedYear, selectedMonth] = currentMonth.split('-');
            yearSelector.value = selectedYear;
            document.getElementById('monthSelector').value = selectedMonth;

            // 確認按鈕事件
            document.getElementById('confirmMonthBtn').onclick = () => {
                const year = document.getElementById('yearSelector').value;
                const month = document.getElementById('monthSelector').value;
                currentMonth = `${year}-${month}`;
                renderHistory();
            };

            // 當月按鈕事件
            document.getElementById('currentMonthBtn').onclick = () => {
                currentMonth = currentYearMonth;
                renderHistory();
            };

            // 過濾當前月份的記錄
            const filteredExpenses = expenses.filter(e => {
                const date = new Date(e.date);
                const expenseMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                return expenseMonth === currentMonth;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            // 渲染表格
            const tbody = document.getElementById('historyBody');
            if (filteredExpenses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <div class="empty-state-text">尚無記錄</div>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filteredExpenses.map(expense => {
                    const date = new Date(expense.date);
                    const formattedDate = `${date.getMonth() + 1}/${date.getDate()}`;
                    const currencySymbol = expense.currency === 'TWD' ? 'NT$' : expense.currency === 'JPY' ? '¥' : '$';

                    return `
                        <tr>
                            <td>${formattedDate}</td>
                            <td>${expense.item}</td>
                            <td style="font-family: 'JetBrains Mono', monospace; font-weight: 600;">${currencySymbol} ${expense.amount.toLocaleString()}</td>
                            <td>${expense.currency}</td>
                            <td><span class="payer-badge payer-${expense.payer === '淵' ? 'yuan' : 'yen'}">${expense.payer}</span></td>
                            <td>${expense.paymentMethod}</td>
                            <td><button class="delete-btn" onclick="deleteExpense(${expense.id})">刪除</button></td>
                        </tr>
                    `;
                }).join('');
            }
        }

        // 刪除記帳 - 確保雲端同步刪除
        async function deleteExpense(id) {
            if (confirm('確定要刪除這筆記帳嗎?')) {
                console.log('開始刪除記帳 ID:', id);

                // 設定同步標記,防止 Firebase 監聽器干擾
                isSyncing = true;
                setSyncStatus('syncing');

                // 1. 先從 Firebase 雲端刪除(如果已登入)
                if (firebaseInitialized && currentUser) {
                    try {
                        const key = `expense_${id}`;
                        await firebase.database().ref(`expenses/${key}`).remove();
                        console.log('✓ 雲端刪除成功:', key);
                    } catch (error) {
                        console.error('雲端刪除失敗:', error);
                        isSyncing = false;
                        setSyncStatus('error');
                        alert('刪除失敗:' + error.message);
                        return;
                    }
                }

                // 2. 從內存中刪除
                expenses = expenses.filter(e => e.id !== id);

                // 3. 更新到本地儲存
                try {
                    await window.storage.set('expenses-data', JSON.stringify(expenses));
                    console.log('✓ 本地刪除成功,剩餘:', expenses.length, '筆記錄');
                } catch (error) {
                    console.error('本地儲存失敗:', error);
                }

                // 4. 解除同步標記
                isSyncing = false;
                setSyncStatus('synced');

                // 5. 更新視圖
                updateAllViews();
            }
        }

        // 啟動應用
        init();
    </script>
